name: Apple Auris checks

on:
  workflow_dispatch:
  push:
    branches: [feature/automix-core-v2]
    paths:
      - "app/src/**"
      - "shared/src/**"
      - "sharedUi/src/**"
      - "audio/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/apple-auris-tests.yml"

permissions:
  contents: read

concurrency:
  group: apple-auris-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-auris-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

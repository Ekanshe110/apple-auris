name: Apple Auris tests

on:
  workflow_dispatch:
  push:
    branches: [feature/automix-core-v2]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: apple-auris-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-auris-test-reports
          path: app/build/reports/tests/
